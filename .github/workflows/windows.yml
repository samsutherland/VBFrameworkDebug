name: Windows debugger tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag must match package.json version v$version."
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test full architecture and symbol matrix
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          Start-Transcript -Path dist\test.log
          try { .\scripts\test.ps1 } finally { Stop-Transcript }
      - name: Package verified workers
        shell: pwsh
        run: .\scripts\build.ps1 -Package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vb-framework-debug-windows
          path: |
            dist\*.vsix
            dist\release-info.json
            dist\test.log
          if-no-files-found: error

  draft-prerelease:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    needs: test-and-package
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vb-framework-debug-windows
          path: release
      - name: Verify package and draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $info = Get-Content release\release-info.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -cne "v$($info.version)" -or $info.revision -ne $env:GITHUB_SHA -or $info.sourceDirty) {
            throw 'Release provenance does not match the clean tagged source.'
          }
          $vsix = Join-Path release $info.package
          if ((Get-FileHash -LiteralPath $vsix -Algorithm SHA256).Hash -ne $info.sha256) {
            throw 'VSIX checksum does not match release metadata.'
          }
          "$($info.sha256.ToLowerInvariant())  $($info.package)" |
            Set-Content release\SHA256SUMS.txt -Encoding ascii
          @'
          ## Preview

          Local Windows .NET Framework 4.8 debugger for VB.NET console and WinForms applications.
          Includes x86/x64 workers, Portable/Windows PDBs, read-only expressions, conditional
          breakpoints/hit counts/logpoints, exception stops, pause, source maps, and PID attach/detach.

          ## Install

          Download the VSIX below and run **Extensions: Install from VSIX...** in VS Code.
          Select x86 for 32-bit/Prefer32Bit targets; otherwise use x64.
          See the README at this release tag for launch/attach examples and supported expression semantics.
          GitHub VSIX installations do not auto-update; install a newer VSIX to update.

          ## Validation and limitations

          Built by GitHub Actions after the Windows x86/x64 and Portable/Windows PDB test matrix.
          SHA256SUMS.txt and release-info.json identify this exact build.
          This is a preview, not Visual Studio debugger parity: no method/getter execution,
          logical async stacks, mixed mode, remote debugging, or modern .NET/CoreCLR.
          Forcibly killing an attached paused target can report a native CLR cleanup warning.
          Separate clean-Windows validation without Visual Studio is still outstanding.
          '@ | Set-Content release\notes.md -Encoding utf8NoBOM
          $releases = gh release list --repo $env:GH_REPO --limit 1000 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $existing = @($releases | Where-Object tagName -CEQ $env:GITHUB_REF_NAME)
          if ($existing.Count -gt 1) { throw 'Multiple releases found for this tag.' }
          if ($existing.Count -eq 1) {
            if (!$existing[0].isDraft -or !$existing[0].isPrerelease) {
              throw 'Refusing to upload build assets to a published or non-prerelease release.'
            }
            gh release upload $env:GITHUB_REF_NAME $vsix release\release-info.json release\SHA256SUMS.txt
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --draft --prerelease `
              --title "VB.NET Framework Debugger $env:GITHUB_REF_NAME (preview)" `
              --notes-file release\notes.md $vsix release\release-info.json release\SHA256SUMS.txt
          }
